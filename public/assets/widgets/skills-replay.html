<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat Skill Animation</title>
<style>
  :root{
    --bg:#f6f7f9;
    --line:#e4e7eb;
    --text:#17191d;
    --muted:#99a0aa;
    --green:#26a269;
    --edge:28px;
    --top-gap:28px;
  }
  *{box-sizing:border-box}
  html,body{
    width:100%;height:100%;margin:0;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    cursor:default;
  }
  button{font:inherit}
  .page{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
  .shell{
    position:relative;
    width:min(760px,calc(100vw - 40px));
    height:min(540px,calc(100vh - 40px));
    min-height:470px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 16px 50px rgba(27,33,43,.07);
    overflow:hidden;
    user-select:none;
  }

  /* Conversation thread: natural iMessage-like flow, fixed near top */
  .thread{
    position:absolute;
    left:var(--edge); right:var(--edge); top:var(--top-gap); bottom:24px;
    display:flex; flex-direction:column; align-items:stretch; gap:18px;
    pointer-events:none;
  }
  .bubble{opacity:0; transform:translateY(10px) scale(.985); transition:opacity .34s ease, transform .42s cubic-bezier(.2,.82,.2,1)}
  .bubble.show{opacity:1; transform:none}
  .user-bubble{
    align-self:flex-end;
    width:min(66%,560px);
    padding:14px 18px;
    border-radius:20px 20px 7px 20px;
    background:#f1f3f5;
    color:#34383f;
    font-size:13px;
    line-height:1.62;
    transform-origin:100% 100%;
  }
  .ai-wrap{
    align-self:flex-start;
    width:min(82%,600px);
    display:flex; gap:10px; align-items:flex-start;
    transform-origin:0 0;
  }
  .ai-mark{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center;background:transparent}
  .ai-mark img{width:17px;height:17px;display:block;object-fit:contain}
  .ai-bubble{flex:1;min-width:0;padding-top:1px;color:#262a30;font-size:14px;line-height:1.65}
  .thinking{height:28px;display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(4px);transition:.24s ease}
  .thinking.show{opacity:1;transform:none}
  .dot{width:6px;height:6px;border-radius:50%;background:#9096a0;animation:dot 1s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.14s}.dot:nth-child(3){animation-delay:.28s}
  @keyframes dot{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-3px);opacity:1}}
  .work-time{display:none;margin:0 0 8px;color:var(--muted);font-size:10.5px;line-height:1.2;letter-spacing:.01em}
  .work-time.show{display:block}
  .answer{display:none;white-space:pre-wrap}
  .answer.show{display:block}
  .caret{display:inline-block;width:2px;height:1.03em;margin-left:2px;vertical-align:-.14em;background:#676d76;animation:blink .78s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* Floating skill chip */
  .skill-floating{
    position:absolute; z-index:24;
    left:var(--edge); top:var(--top-gap);
    display:flex; align-items:center; gap:8px;
    height:30px; padding:0 10px 0 8px;
    border:1px solid #e1e4e8; border-radius:9px;
    background:#f4f5f7; color:#383c43;
    font-size:11.5px; font-weight:650;
    opacity:0; transform:translateY(8px) scale(.97);
    pointer-events:none;
    transition:opacity .28s ease, transform .38s cubic-bezier(.18,.84,.2,1.12), top .7s cubic-bezier(.2,.78,.2,1);
  }
  .skill-floating.show{opacity:1; transform:translateY(0) scale(1)}
  .file-icon{position:relative;width:21px;height:24px;border:1.3px solid #8c929c;border-radius:5px;background:#fff;flex:0 0 auto}
  .file-icon:before{content:"";position:absolute;right:3px;top:4px;width:7px;height:1.3px;background:#a0a5ad;box-shadow:0 4px 0 #a0a5ad,0 8px 0 #a0a5ad}
  .file-icon:after{content:"MD";position:absolute;left:3px;bottom:2px;font-size:5.5px;font-weight:800;color:#707680}

  /* Composer */
  .composer{
    position:absolute; z-index:20;
    left:var(--edge); right:var(--edge); top:var(--top-gap);
    min-height:92px; height:92px;
    padding:12px 50px 38px 14px;
    background:#fff; border:1px solid #dce1e7; border-radius:18px;
    box-shadow:0 8px 24px rgba(30,36,46,.05);
    overflow:hidden;
    transition:top .72s cubic-bezier(.2,.78,.2,1), height .24s ease, opacity .22s ease, transform .18s ease, border-color .28s ease, box-shadow .28s ease;
    will-change:top,height,opacity;
  }
  .composer.active{border-color:#cfd4db; box-shadow:0 10px 28px rgba(30,36,46,.08)}
  .composer.hidden{opacity:0; transform:translateY(8px); pointer-events:none}
  .composer.bounce{animation:bounceDown .42s cubic-bezier(.22,1.16,.32,1)}
  @keyframes bounceDown{0%{transform:translateY(0)}45%{transform:translateY(9px)}100%{transform:translateY(0)}}

  .input-text{
    height:28px; min-height:28px; max-height:88px; overflow:hidden;
    white-space:pre-wrap; color:#2e3238;
    font-size:12.4px; line-height:1.5;
    transition:height .22s ease;
  }
  .placeholder{color:#a3a9b2}
  .toolbar{position:absolute;left:12px;bottom:8px}
  .skill-button{height:26px;padding:0 9px;border:0;border-radius:9px;background:#f3f4f6;color:#606670;font-size:11.5px;pointer-events:none}
  .send{position:absolute;right:10px;bottom:8px;width:33px;height:33px;border:0;border-radius:50%;display:grid;place-items:center;background:#181a1e;color:#fff;transition:transform .16s ease;pointer-events:none}
  .send.press{transform:scale(.87)} .send svg{width:14px;height:14px}

  /* Preview overlay */
  .preview-backdrop{
    position:absolute; inset:0; z-index:25;
    opacity:0; pointer-events:none;
    background:rgba(246,247,249,.14);
    backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px);
    transition:opacity .22s ease, backdrop-filter .3s ease, -webkit-backdrop-filter .3s ease;
  }
  .preview-backdrop.show{opacity:1; backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px)}
  .skill-preview{
    position:absolute; z-index:26;
    left:50%; top:64px; width:min(520px, calc(100% - 74px));
    padding:16px 17px 17px;
    transform:translate(-50%,8px) scale(.985);
    opacity:0; pointer-events:none;
    background:rgba(255,255,255,.98);
    border:1px solid #dfe3e8; border-radius:17px;
    box-shadow:0 22px 64px rgba(22,28,37,.13);
    transition:opacity .24s ease, transform .34s cubic-bezier(.2,.8,.2,1);
  }
  .skill-preview.show{opacity:1; transform:translate(-50%,0) scale(1)}
  .preview-head{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid #eceef1;font-size:11.5px;font-weight:700}
  .preview-code{margin-top:12px;white-space:pre-wrap;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:10.5px;line-height:1.58;color:#4b5058}
  .md-key{font-weight:800;color:#17191d}.md-soft{color:#8d939c}

  .pointer{position:absolute;z-index:30;width:17px;height:23px;opacity:0;pointer-events:none;transition:left .42s cubic-bezier(.2,.74,.2,1),top .42s cubic-bezier(.2,.74,.2,1),opacity .16s ease}
  .pointer:before{content:"";position:absolute;left:1px;top:0;width:13px;height:20px;background:#111317;clip-path:polygon(0 0,0 100%,4px 13px,8px 22px,11px 20px,7px 12px,14px 12px)}
  .pointer.click:after{content:"";position:absolute;left:-7px;top:-7px;width:28px;height:28px;border:1px solid rgba(20,22,25,.22);border-radius:50%;animation:ring .34s ease-out both}
  @keyframes ring{from{transform:scale(.35);opacity:.85}to{transform:scale(1.3);opacity:0}}

  .completion{position:absolute;z-index:50;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;background:rgba(248,250,249,.12);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:opacity .55s ease,backdrop-filter .65s ease,-webkit-backdrop-filter .65s ease}
  .completion.show{opacity:1;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--green);box-shadow:0 12px 34px rgba(38,162,105,.22);transform:scale(.72);opacity:0;transition:transform .58s cubic-bezier(.16,.9,.22,1.22),opacity .35s ease}.completion.show .check{transform:scale(1);opacity:1}.check svg{width:34px;height:34px}

  @media(max-height:560px){
    .shell{height:calc(100vh - 24px);min-height:0}
  }
.page{padding:0}.shell{width:100%;height:100%;min-height:0;border-radius:12px;box-shadow:none}.thread{gap:14px}.dormant *{animation-play-state:paused!important}.thinking:not(.show) .dot{animation-play-state:paused}.caret{will-change:auto}.ai-bubble{max-height:calc(100vh - 230px);overflow:auto;scrollbar-width:none}.skill-preview{max-width:calc(100vw - 28px);max-height:calc(100vh - 40px);overflow:hidden}.skill-preview .preview-code{max-height:calc(100vh - 100px);overflow:hidden}@media(max-width:440px){:root{--edge:16px;--top-gap:18px}.user-bubble{font-size:12px;line-height:1.55;max-height:145px;overflow:hidden}.answer{font-size:12px;line-height:1.65}.ai-mark{flex:0 0 24px}.composer{left:16px;right:16px}.preview-code{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
.mac-bar{position:fixed;left:0;right:0;top:0;height:30px;background:#f6f6f7;border-bottom:1px solid #e3e4e6;display:flex;align-items:center;gap:7px;padding:0 12px;z-index:60;pointer-events:none}.mac-bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57;display:block}.mac-bar i:nth-child(2){background:#febc2e}.mac-bar i:nth-child(3){background:#28c840}</style>

<span class="md-key">## Tone</span>
轻量、清晰、可信；避免过度营销。</div>
    </div>

    <div class="pointer" id="pointer"></div>
    <div class="completion" id="completion"><div class="check"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M10.5 20.5 17 27l13-14" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  </main>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  let visible=false,active=false,started=false,wake;
  const tick=ms=>new Promise(r=>setTimeout(r,ms));
  async function sleep(ms){while(ms>0){while(!active)await new Promise(r=>wake=r);const t=Math.min(ms,100);await tick(t);if(active)ms-=t}}
  function visibility(v){visible=v;active=v&&!document.hidden;document.documentElement.classList.toggle('dormant',!active);if(active){wake?.();wake=null;if(!started){started=true;play()}}}
  addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data?.type==='replay-visible')visibility(e.data.active)});
  document.addEventListener('visibilitychange',()=>visibility(visible));
  const shell = $('#shell');
  const composer = $('#composer');
  const inputText = $('#inputText');
  const skillButton = $('#skillButton');
  const skillFloating = $('#skillFloating');
  const previewBackdrop = $('#previewBackdrop');
  const skillPreview = $('#skillPreview');
  const sendButton = $('#sendButton');
  const userBubble = $('#userBubble');
  const aiWrap = $('#aiWrap');
  const thinking = $('#thinking');
  const workTime = $('#workTime');
  const answer = $('#answer');
  const answerText = $('#answerText');
  const caret = $('#caret');
  const pointer = $('#pointer');
  const completion = $('#completion');

  const zh = '把分散在文档、会议记录和网页里的信息整理到同一个智能工作区。系统可以自动提取重点、归纳任务、生成结构化摘要，并根据上下文继续写作。你不需要学习复杂的分类方法，只要把已有内容放进来，就能快速得到清晰、可继续编辑的结果。所有内容都保留原始层级，适合团队整理研究资料、项目笔记、产品需求和日常灵感。现在可以免费开始，无需复杂设置。';
  const ru = 'Соберите документы, заметки со встреч и материалы из интернета в одном умном рабочем пространстве.\n\nСистема автоматически выделяет главное, формирует задачи, создаёт структурированные резюме и помогает продолжать работу с текстом с учётом контекста.\n\nНе нужно осваивать сложную систему организации: добавьте исходные материалы и получите понятный результат, который можно сразу редактировать.\n\nПодходит для исследований, проектных заметок, требований к продукту и повседневных идей.\n\nНачать бесплатно — без сложной настройки.';
  let runId = 0;

  function localRect(el){ const a = shell.getBoundingClientRect(); const b = el.getBoundingClientRect(); return {left:b.left-a.left, top:b.top-a.top, width:b.width, height:b.height}; }
  function movePointerTo(el, dx=0, dy=0){ const r = localRect(el); pointer.style.left = (r.left + r.width*0.62 + dx) + 'px'; pointer.style.top = (r.top + r.height*0.55 + dy) + 'px'; }
  async function clickWithPointer(el){ movePointerTo(el); pointer.style.opacity='1'; await sleep(380); pointer.classList.remove('click'); void pointer.offsetWidth; pointer.classList.add('click'); el.classList.add('press'); await sleep(130); el.classList.remove('press'); await sleep(100); }
  function isMajorPunctuation(ch){ return ch === '\n' || '。.!?！？'.includes(ch); }

  function syncComposerHeight(){
    inputText.style.height = 'auto';
    const target = Math.max(28, Math.min(88, inputText.scrollHeight));
    inputText.style.height = target + 'px';
    composer.style.height = (target + 52) + 'px';
  }

  function computeBottomLayout(){
    const shellH = shell.clientHeight;
    const compH = composer.offsetHeight || parseFloat(composer.style.height) || 92;
    const bottomTop = Math.max(170, shellH - 20 - compH);
    composer.style.top = bottomTop + 'px';
    const skillTop = Math.max(130, bottomTop - 42);
    skillFloating.style.top = skillTop + 'px';
  }

  async function typeText(el, text, totalMs, id){
    el.textContent='';
    syncComposerHeight();
    const base=Math.max(7,totalMs/text.length);
    for(let i=0;i<text.length;i++){
      if(id!==runId) return;
      el.textContent += text[i];el.scrollTop=el.scrollHeight;
      syncComposerHeight();
      const punctuation = '，。；：、！？\n'.includes(text[i]);
      await sleep(punctuation ? base*1.8 : base*(0.72 + Math.random()*0.48));
    }
  }

  function reset(){
    runId++;
    completion.classList.remove('show');
    composer.className = 'composer';
    composer.style.top = '28px';
    composer.style.height = '92px';
    composer.style.opacity = '';
    inputText.innerHTML = '<span class="placeholder">'+(document.documentElement.lang==='en'?'Enter content…':'输入内容…')+'</span>';
    inputText.style.height = '28px';
    skillFloating.className = 'skill-floating';
    skillFloating.style.top = '28px';
    previewBackdrop.classList.remove('show');
    skillPreview.classList.remove('show');
    userBubble.classList.remove('show');
    userBubble.textContent = '';
    aiWrap.classList.remove('show');
    thinking.classList.remove('show');
    workTime.classList.remove('show');
    answer.classList.remove('show');
    answerText.textContent = '';
    caret.style.display = 'inline-block';
    pointer.style.opacity = '0';
    pointer.classList.remove('click');
  }

  async function play(){
    reset();
    const id = ++runId;
    await sleep(450);
    composer.classList.add('active');
    await sleep(350);
    await typeText(inputText, zh, 2900, id);
    if(id!==runId) return;
    await sleep(280);

    await clickWithPointer(skillButton);
    skillFloating.classList.add('show');
    composer.style.top = '68px';
    composer.classList.add('bounce');
    await sleep(460);
    composer.classList.remove('bounce');

    await clickWithPointer(skillFloating);
    previewBackdrop.classList.add('show');
    skillPreview.classList.add('show');
    await sleep(1500);
    skillPreview.classList.remove('show');
    previewBackdrop.classList.remove('show');
    await sleep(180);

    computeBottomLayout();
    await sleep(720);

    await clickWithPointer(sendButton);
    pointer.style.opacity='0';
    userBubble.textContent = zh;
    userBubble.classList.add('show');
    composer.classList.add('hidden');
    skillFloating.classList.remove('show');
    await sleep(260);

    aiWrap.classList.add('show');
    thinking.classList.add('show');
    await sleep(1500);
    thinking.classList.remove('show');
    workTime.classList.add('show');
    answer.classList.add('show');
    answerText.textContent='';
    await sleep(100);

    const chars = Array.from(ru);
    for(let i=0;i<chars.length;i++){
      if(id!==runId) return;
      answerText.textContent += chars[i];answerText.parentElement.parentElement.scrollTop=answerText.parentElement.parentElement.scrollHeight;
      await sleep(isMajorPunctuation(chars[i]) ? 30 : 9 + Math.random()*13);
    }

    caret.style.display='none';
    await sleep(520);
    completion.classList.add('show');
    await sleep(5000);
    if(id===runId) play();
  }

  document.addEventListener('pointerdown', e => e.preventDefault(), true);
  document.addEventListener('click', e => e.preventDefault(), true);
  document.addEventListener('keydown', e => e.preventDefault(), true);
  if(parent===window)window.addEventListener('load',()=>visibility(true),{once:true});
})();
</script>
<script>
let embedLang='zh';const originalUi=new Map();function chatLocale(lang){embedLang=lang;document.documentElement.lang=lang;let dict={};try{dict=parent.PORTFOLIO_TRANSLATIONS||{}}catch{}const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement.closest('script,style,#userBubble,#inputText,#answerText'))continue;if(!originalUi.has(n))originalUi.set(n,n.textContent);const t=originalUi.get(n),key=t.trim();n.textContent=lang==='en'&&dict[key]?t.replace(key,dict[key]):t}const placeholder=document.querySelector('.placeholder');if(placeholder)placeholder.textContent=lang==='en'?'Enter content…':'输入内容…'}
addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='portfolio-language')chatLocale(e.data.lang)});
</script>
</body>
</html>
