  set('sub',t('五层互斥人群 · 合计 1,407,580 人 · 每刻度约 1 万用户','Five mutually exclusive segments · 1,407,580 users total · One tick ≈ 10,000 users'));
  list=DATA.segments.map((d,i)=>[t(...names.segments[i]),n(d.user_count),d.user_pct+'%']);note=cohortNotes[selected];
 }else{
  set('heading',t('较早窗口的自然购买率更高','Earlier windows retain more natural purchases'));
  set('sub',t('首次加购后仍未购买的人群 · 随后 24h 自然购买率 · 每档 0.1 个百分点','Unpurchased after first cart · Natural purchase rate over the next 24h · One rung = 0.1 percentage point'));
  list=DATA.timing.map((d,i)=>[[1,6,24][i]+' H',d.natural_transaction_rate_24h+'%',n(d.trigger_eligible_users)]);note=timeNotes[selected];
  const d=DATA.timing[selected];document.getElementById('metrics').innerHTML='<div class="window-metrics"><div><strong>'+n(d.trigger_eligible_users)+'</strong><span>'+t('窗口开始时仍未购买','Unpurchased at window start')+'</span><p>'+t('覆盖首次加购用户','Share of first-cart users')+' '+d.eligible_pct+'%</p></div><div><strong>'+n(d.later_transaction_users)+'</strong><span>'+t('随后 24h 自然购买人数','Natural purchasers in the next 24h')+'</span><p>'+t('自然购买率','Natural purchase rate')+' '+d.natural_transaction_rate_24h+'%</p></div></div>';
 }
 choices.innerHTML=list.map((a,i)=>'<button data-index="'+i+'" aria-pressed="'+(selected===i)+'"><span>'+a[0]+'</span><span><strong>'+a[1]+'</strong> · '+a[2]+'</span></button>').join('');
 if(mode==='timing')choices.querySelectorAll('button').forEach((b,i)=>{b.innerHTML='<span>'+[1,6,24][i]+' H</span><strong>'+DATA.timing[i].natural_transaction_rate_24h+'%</strong>'});

 chart.setAttribute('aria-label',document.getElementById('heading').textContent+'; '+list.map(a=>a.join(' ')).join('; '));measure();
}
// L13 · Hourglass Stream — original barcode strips and falling hairline paths.
function funnel(s){
 const STAGE=DATA.funnel.map((d,i)=>[t(...names.funnel[i]),Number(d.visitor_count)]);
 const CXm=153,sy=k=>55+k*126,w=c=>c/STAGE[0][1]*246;
 STAGE.forEach(([name,c],k)=>{const parent=s;s=el(parent,'g',{'data-series':k});const y=sy(k),hw=w(c)/2,count=Math.max(1,Math.round(c/20000));
  for(let j=0;j<count;j++){const x=CXm-hw+(j+.5)/count*hw*2;el(s,'line',{x1:x,y1:y-7,x2:x,y2:y+7,stroke:INK,'stroke-width':.8,opacity:.45+rnd(j+2,k+5)*.5,class:'fade',style:`animation-delay:${k*.12+j*.012}s`})}
  if(k<STAGE.length-1){const hw1=w(STAGE[k+1][1])/2;for(let j=0;j<34;j++){const xt=CXm+(rnd(j+1,k*7+1)-.5)*2*hw*.94,xb=CXm+(rnd(j+3,k*7+5)-.5)*2*hw1*.94;el(s,'path',{d:`M${xt} ${y+8} C${xt} ${y+54} ${xb} ${sy(k+1)-54} ${xb} ${sy(k+1)-8}`,fill:'none',stroke:L[4],'stroke-width':.5,opacity:.32,pathLength:1,class:'draw',style:`animation-delay:${.2+k*.15+j*.008}s;animation-duration:.8s`})}txt(s,{x:22,y:(y+sy(k+1))/2+3,'font-size':17,'font-weight':800,fill:L[2],class:'fade',style:`animation-delay:${.5+k*.15}s`},Number(DATA.funnel[k+1].previous_stage_rate_pct).toFixed(2)+'%');txt(s,{x:22,y:(y+sy(k+1))/2+19,'font-size':11,'font-weight':600,fill:L[2]},t('上一步转化','FROM PREVIOUS'))}
  el(s,'line',{x1:CXm+hw+6,y1:y,x2:286,y2:y,stroke:GRID,'stroke-width':.8,class:'fade',style:`animation-delay:${.3+k*.12}s`});txt(s,{x:294,y:y-4,'font-size':13,'font-weight':600,fill:L[1],class:'fade',style:`animation-delay:${.35+k*.12}s`},name);txt(s,{x:294,y:y+17,'font-size':17,'font-weight':800,fill:INK,class:'fade',style:`animation-delay:${.4+k*.12}s`},n(c));s=s.parentNode;
 });
}
// F5 · Tick Rows — original queue of hairline ticks, guide floor, every-fifth dot.
function segments(s){
 const unit=10000,X0=20,PX=2.9,y0=i=>58+i*63,max=Number(DATA.segments[0].user_count)/unit;
 DATA.segments.forEach((d,i)=>{const parent=s;s=el(parent,'g',{'data-series':i});const v=Number(d.user_count)/unit,y=y0(i),shade=i===2?INK:L[2];
  txt(s,{x:X0,y:y-19,'font-size':14,'font-weight':600,fill:L[1],class:'fade',style:`animation-delay:${i*.1}s`},t(...names.segments[i]));txt(s,{x:380,y:y-19,'text-anchor':'end','font-size':14,'font-weight':800,fill:INK,class:'fade',style:`animation-delay:${i*.1}s`},n(d.user_count));el(s,'line',{x1:X0,y1:y+9,x2:X0+max*PX,y2:y+9,stroke:GRID,'stroke-width':.6,class:'fade',style:`animation-delay:${i*.1}s`});
  for(let k=0;k<Math.ceil(v);k++){const fraction=Math.min(1,v-k),x=X0+(k+fraction/2)*PX,h=(9+rnd(k+1,i+2)*6)*fraction;el(s,'line',{x1:x,y1:y+9,x2:x,y2:y+9-h,stroke:shade,'stroke-width':.9,opacity:.55+rnd(k+3,i+5)*.45,class:'fade',style:`animation-delay:${i*.1+k*.012}s`});if(k%5===4)el(s,'circle',{cx:x,cy:y+13,r:.8,fill:FAINT,class:'fade',style:`animation-delay:${i*.1+k*.012}s`})}s=s.parentNode;
 });
}
// F1 · Rung Bars — original vertical ladders, fractional final rung, shared zero.
function timing(s){
 const base=276,step=6.5,HW=22;
 for(let tick=0;tick<=3;tick++){const y=base-tick*10*step;el(s,'line',{x1:30,y1:y,x2:372,y2:y,stroke:GRID,'stroke-width':.6,'stroke-dasharray':'2 5'});txt(s,{x:21,y:y+4,'font-size':11,'font-weight':600,fill:L[2],'text-anchor':'end'},tick+'%')}
 DATA.timing.forEach((d,i)=>{const parent=s;s=el(parent,'g',{'data-series':i});const x=84+i*112,v=Number(d.natural_transaction_rate_24h)*10;
  for(let k=0;k<Math.ceil(v);k++){const fraction=Math.min(1,v-k),y=base-(k+fraction)*step,width=(HW-1.5+rnd(k+1,i+2)*3)*fraction;el(s,'line',{x1:x-width,y1:y,x2:x+width,y2:y,stroke:INK,'stroke-width':1,opacity:.5+rnd(k+2,i+4)*.5,class:'fade',style:`animation-delay:${i*.1+k*.012}s`});if(k%5===4)el(s,'circle',{cx:x+HW+4.5,cy:y,r:.8,fill:FAINT,class:'fade',style:`animation-delay:${i*.1+k*.012}s`})}
  txt(s,{x,y:base-v*step-15,'font-size':20,'font-weight':800,fill:INK,'text-anchor':'middle',class:'fade',style:`animation-delay:${.4+i*.1}s`},d.natural_transaction_rate_24h+'%');txt(s,{x,y:base+27,'font-size':14,'font-weight':600,fill:L[1],'text-anchor':'middle',class:'fade',style:`animation-delay:${i*.1}s`},[1,6,24][i]+' H');s=s.parentNode;
 });el(s,'line',{x1:30,y1:base+4,x2:372,y2:base+4,stroke:GRID,'stroke-width':.8,class:'fade'});
}
function paint(s){s.innerHTML='';(mode==='segments'?segments:mode==='timing'?timing:funnel)(s);ready=true;measure()}
// Retain the token's reveal + replay lifecycle, with a callable render for language changes.
const entrance=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){paintNow=()=>paint(chart);paint(chart);entrance.disconnect()}},{threshold:.01});entrance.observe(chart);
document.getElementById('view-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;mode=b.dataset.view;selected=mode==='segments'?2:0;configure();if(ready)paintNow();});
choices.addEventListener('click',e=>{const button=e.target.closest('button[data-index]');if(!button)return;selected=Number(button.dataset.index);configure();const series=chart.querySelector('[data-series="'+selected+'"]');if(series){const replay=series.cloneNode(true);replay.dataset.replay=String(Number(series.dataset.replay||0)+1);for(const node of replay.querySelectorAll('.fade,.draw'))node.style.animationDelay=Math.max(0,(parseFloat(node.style.animationDelay)||0)-selected*.1)+'s';series.replaceWith(replay);}choices.querySelector('[data-index="'+selected+'"]').focus({preventScroll:true})});

addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(!['funnel','segments','timing'].includes(next)||next===mode)return;mode=next;selected=mode==='segments'?2:0;configure();if(ready)paintNow();});
let lastHeight=0;function measure(){const height=Math.ceil(root.getBoundingClientRect().height)+2;if(height!==lastHeight){lastHeight=height;parent.postMessage({type:'portfolio-embed-height',kind:'retailrocket',height},location.origin)}}
function visibility(){root.dataset.active=String(active&&!document.hidden)}
addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data?.type==='portfolio-language'){lang=e.data.lang==='en'?'en':'zh';configure();if(ready)paintNow()}if(e.data?.type==='retailrocket-view'){const next=e.data.mode;if(['funnel','segments','timing'].includes(next)&&next!==mode){mode=next;selected=mode==='segments'?2:0;configure();if(ready)paintNow()}}if(e.data?.type==='replay-visible'){active=!!e.data.active;visibility()}});document.addEventListener('visibilitychange',visibility);new ResizeObserver(measure).observe(root);configure();
</script>
