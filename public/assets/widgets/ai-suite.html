/* ---------- Combined light system: no dark frame when a card expands ---------- */
:root{--paper:#fbfbfc;--night:#ffffff;--near:#1d2027;--gray:#6e727c;--darkgray:#c9ced7;--grid:#d4d7dd}

const SKILLS=[{"id": "article-craft", "name": "article-craft", "kind": "article", "area": "a", "group": "内容生产", "intro": "写一篇高质量的SEO文章，最耗时的往往不是落笔，而是弄清搜索者真正想解决什么、核对产品能否完成这些操作，再准备准确的截图和页面字段。这项Skill把SERP调研、选题去重、内容结构、图文匹配和文章建文串在一起。使用时从关键词和目标读者开始，逐步形成可以回读检查的待审核稿；事实不确定或素材不匹配的地方会留下人工核验空间。", "inputs": ["主关键词、目标读者与语言", "搜索结果中的真实需求与竞争内容", "可验证的产品功能和已有素材"], "outputs": ["具备SEO结构的文章HTML", "完成配图、内链和元信息的审核草稿", "可回查的创建结果与待验证项目"], "steps": [["意图与证据", "识别搜索意图及读者要完成的具体任务，对比主流结果的步骤覆盖、遗漏与差异点；对格式、兼容性和产品能力进行事实核验。"], ["主题与结构", "检索同主题内容避免重复建设，整理主要与次要关键词；围绕问题、操作路径和结果组织H2/H3，而不是堆砌通用定义。"], ["图文配套", "优先查找真实功能界面及已有可复用素材；缺少合适图片时再补示意图，检查alt、图注和图片语义是否对应。"], ["内容组装", "编排可执行步骤、注意事项、FAQ、相关内容内链与行动入口；统一HTML语义、标题层级和基础元信息。"], ["草稿校验", "核验分类、语言、页面地址和必要字段；写入待审核状态，并回读页面，人工确认后才进入发布。"]], "guards": ["不编造产品能力、转换结果或界面操作", "优先复用经过验证的截图，不用虚构产品界面", "新内容不自动发布，保留人工审核门槛"], "links": ["access-gateway", "asset-library", "content-manager"]}, {"id": "batch-compose", "name": "batch-compose", "kind": "batch", "area": "b", "group": "批量生产", "intro": "当选题进入批量生产阶段，重复创建页面、填写字段和逐条检查状态很容易占用大量运营时间。这项Skill先由人确定关键词清单和通用规则，再逐项生成内容并独立写入，最后把每篇成功、失败或需要返工的情况整理出来。交付的是一批可继续审稿的草稿，而不是未经确认就上线的文章。", "inputs": ["人工提供或已选中的关键词集合", "目标内容形态、站点与语言", "共用的创作规则和字段约束"], "outputs": ["批量草稿与逐项状态", "成功、失败及待修正清单", "可复查的输入和字段映射"], "steps": [["确定批次", "从自备关键词或候选趋势中选定清单，先确认处理数量，不默认全量生成。"], ["共享配置", "确定内容类型、语言和分类，再把一套可复用的页面字段规则应用到同批条目。"], ["逐项构建", "按关键词生成标题、内容与必要元数据，同时检查重复主题和必填字段。"], ["独立写入", "为每条内容单独处理创建结果，避免局部失败使整个批次状态不透明。"], ["输出回执", "汇总每条内容的草稿状态、未通过项目及原因，交由人工逐条审核。"]], "guards": ["批量目标必须经过用户选定", "禁止以任务提交成功替代逐条结果确认", "所有新条目均保留审核步骤"], "links": ["access-gateway", "content-manager", "asset-library"]}, {"id": "content-manager", "name": "content-manager", "kind": "manage", "area": "c", "group": "内容管理", "intro": "日常内容运营需要不断查询已有文章、补充素材、调整字段，也会遇到文章、组件页和问答内容混在一起的情况。这个Skill让这些单条操作可以从自然语言发起，但每次修改前都先查明对象、站点范围和现有状态，再根据内容类型执行相应操作。最后重新读取结果，确认改动落在了正确的记录上。", "inputs": ["目标内容类型与站点/语言范围", "标题、关键词、正文、素材或修改字段", "对应页面的分类、地址与当前状态"], "outputs": ["检索结果与内容详情", "新建或更新后的记录及操作回执", "可审查的内容状态与关联信息"], "steps": [["查找对象", "按内容类型、语言或关键词定位页面，回读现有字段，避免在未知状态下直接覆写。"], ["检查配置", "确认站点、分类和页面路径约束；必要时从已有配置中获取可用选项，避免构造无效页面关系。"], ["选择操作", "根据任务执行单条创建、字段更新、查询或状态管理；素材问题先走素材匹配。"], ["结果复核", "重新获取内容详情，对比关键字段、页面状态和关联关系，输出明确的执行结果。"]], "guards": ["新建内容先进入审核态，不在无授权情况下发布", "热点、趋势和重定向以查询为主，不越权执行后台管理操作", "修改前先读取实际记录，避免凭猜测提交字段"], "links": ["access-gateway", "asset-library", "batch-compose", "batch-refine"]}, {"id": "batch-refine", "name": "batch-refine", "kind": "refine", "area": "d", "group": "批量维护", "intro": "存量文章积累起来之后，标题、正文片段、说明文案或其他字段往往需要按同一套规则统一修订。这里先筛选准确的目标范围，再将自然语言要求拆成可检查的字段差异，保护不能被破坏的页面结构。每条记录独立更新并保留原有发布状态，方便运营人员识别失败项与高风险改动。", "inputs": ["需要处理的内容范围", "明确的优化规则与预期字段", "已有页面正文、布局片段和发布状态"], "outputs": ["改动前后的差异记录", "逐条更新结果和失败原因", "状态保持一致的更新后内容"], "steps": [["限定范围", "先按内容形态、语言、筛选条件查出目标记录，确认清单，避免误改整个站点。"], ["建立变更集", "把自然语言指令拆分为字段级变更，展示更新前后的差异供检查。"], ["结构保护", "对正文内不可改动的注入节点和页面片段进行保护，非目标字段保持原样。"], ["写入校验", "必要时核对分类、语言与页面路径关系；对校验失败的记录停止写入。"], ["逐条汇报", "保留每条记录原有发布状态，统计实际成功和失败项，突出需人工复检的大改动。"]], "guards": ["不破坏嵌入式组件的保留标记", "不因内容优化自动改变发布状态", "高风险批次需先预览差异"], "links": ["content-manager", "access-gateway", "page-standard"]}, {"id": "multilingual-flow", "name": "multilingual-flow", "kind": "translate", "area": "e", "group": "多语言运营", "intro": "多语言内容扩展不只是把正文翻译成另一种语言。源页的内部链接是否存在对应语言版本、文章是否有目标语分类，都会影响最终页面能否正确使用。这个Skill在提交任务之前逐条检查映射关系，执行后持续追踪异步结果，把缺口、失败和待审译文明确交给运营人员。", "inputs": ["源页面及真实内容类型", "目标语言集合", "目标语言的分类与已有文章映射"], "outputs": ["可跟踪的翻译任务与执行结果", "本地化后的内容审核稿", "逐语言缺口或异常报告"], "steps": [["识别源页", "检查页面类型和目标语言支持范围，不把不同类型混入无法共用规则的批次。"], ["预检映射", "逐语言确认内部链接是否有目标语版本；需要分类的内容还要确认目标语分类映射。"], ["阻断缺口", "遇到缺失内链或分类关系时停止对应任务，并把需要人工补齐的项目明示出来。"], ["执行与轮询", "创建并运行异步翻译任务，持续读取状态，区分已提交、处理中、失败与完成。"], ["验收译文", "核查输出记录、内链与分类是否一致；完成的译文仍保持待审核，不自动上线。"]], "guards": ["任务提交成功不等于翻译完成", "分类与内链映射缺失时不猜测填充", "保留人工语言审核与发布权限"], "links": ["access-gateway", "content-manager"]}, {"id": "asset-library", "name": "asset-library", "kind": "assets", "area": "f", "group": "素材复用", "intro": "制作教程时经常需要一张准确的功能截图，最理想的做法不是每篇文章重新找图，而是先检索现有素材，判断它是否真的对应当前场景。这项Skill把候选检索、图片回退、必要时的上传归档和页面关联组织成一个流程。复用可以减少重复劳动，新素材则在获得确认后才进入共享素材库。", "inputs": ["文章主题或需要展示的功能", "候选图片、语言和语义描述", "需要时由用户提供的本地图片"], "outputs": ["匹配的可复用图片", "经过确认的新增素材记录", "页面图片与素材元数据的关联"], "steps": [["素材检索", "根据功能、标题、alt和主题词查找已有素材，判断是否真正覆盖要表达的操作场景。"], ["候选回退", "优先选用素材库记录；不足时才参考已有页面图片，并避免跨主题错配。"], ["上传与归档", "仅在确定需要新素材且获批准时上传，记录用途、语言与描述等可复用元信息。"], ["页面关联", "将可访问的图片地址用于文章或组件，并在保存后核验关联关系。"]], "guards": ["不将演示素材伪装为真实产品截图", "不未经确认擅自新增或覆盖素材库记录", "复用前检查图片实际内容与上下文是否匹配"], "links": ["article-craft", "content-manager", "batch-compose"]}, {"id": "feature-landing", "name": "feature-landing", "kind": "landing", "area": "g", "group": "落地页", "intro": "功能型落地页既要回答搜索问题，也要让用户快速理解产品能做什么、如何使用，以及下一步点哪里。这项Skill围绕关键词与任务场景组织首屏、功能证据、How-to、FAQ和CTA，再将布局、技术SEO与行为事件接入同一页面。结果是可供设计、运营和开发继续审查的页面交付，而不是一张缺少真实功能依据的概念图。", "inputs": ["目标功能与主要搜索意图", "产品实际可用能力和图文素材", "页面区块和转化目标"], "outputs": ["分区清晰的功能型HTML页面", "具备SEO语义和事件触点的结构", "可用于设计/运营复核的完整交付"], "steps": [["定义页面任务", "从核心关键词映射目标用户的真实痛点，明确首屏应传达的结果和主要动作。"], ["设计转化路径", "组织首屏、痛点说明、功能证据、操作教程、FAQ、关联内容与CTA，形成连贯的阅读动线。"], ["实现页面交互", "组合自适应布局、导航定位、折叠说明、功能展示与行动按钮，保证交互有明确目的。"], ["整合真实素材", "重要能力对应实际产品证据，不使用虚构的界面或未经验证的模板图。"], ["SEO与测量验收", "检查语义标题、结构化信息、移动体验及关键行为事件；人工确认后交付。"]], "guards": ["不对外暴露内部组件调用方式或私有路径", "所有功能描述以可证实能力为准", "下载行为必须同时满足功能与测量规范"], "links": ["page-standard", "layout-kit", "event-measure", "asset-library"]}, {"id": "event-measure", "name": "event-measure", "kind": "analytics", "area": "h", "group": "效果测量", "intro": "页面上的按钮被点击、用户开始下载，和最终完成下载是不同的行为，埋点也应该有清楚的区分。这项Skill从页面目标出发定义事件，约束触发位置与参数口径，再检查是否漏发或重复触发。它输出可复用的测量约定，帮助后续评估入口和交互效果，而不会把意向动作误写成转化结果。", "inputs": ["页面的关键转化目标", "需要衡量的点击、提交或浏览行为", "经批准的标签管理环境"], "outputs": ["可复用的事件触发封装", "页面访问及交互行为信号", "便于后续数据分析的参数约定"], "steps": [["定义事件", "区分页面浏览、下载意向、按钮点击和表单提交等关键行为，明确每个事件的业务含义。"], ["对齐触发点", "把事件绑定到真正发生的用户动作，而非仅在页面加载时虚构点击或转化。"], ["参数规范", "使用一致的页面与组件上下文，保持命名稳定，避免后续报表口径不一致。"], ["验证链路", "检查事件是否重复触发、是否漏发，以及关键参数是否在允许范围内。"]], "guards": ["展示代码不包含真实分析资产ID或管理后台配置", "不采集敏感用户信息作为事件参数", "不能把点击事件直接宣称为已完成下载"], "links": ["feature-landing", "layout-kit", "page-standard"]}, {"id": "layout-kit", "name": "layout-kit", "kind": "layout", "area": "i", "group": "页面组件", "intro": "当不同功能页反复出现导航、CTA、FAQ和页脚时，逐页重新拼装容易带来视觉与交互上的不一致。这个Skill将常用结构沉淀为可组合的部件，并根据页面是否已经拥有外层容器决定要输出哪些部分。完成后还会检查移动端、锚点、折叠交互和脚本顺序，尽量让页面接入时不需要从头调试。", "inputs": ["页面信息架构与品牌设计规范", "是否由外层系统注入公共区域", "交互需求和适配范围"], "outputs": ["可复用的UI区块与布局结构", "统一的响应式页面骨架", "明确的交互挂载位置"], "steps": [["判断容器模式", "区分完整页面和仅输出主体内容的场景，避免与外层系统重复挂载导航或页脚。"], ["组装公共区块", "按需组合顶部导航、产品入口、首屏、CTA、常见问题和页脚，保持布局一致性。"], ["完善移动体验", "处理导航折叠、字号、触控区域和内容顺序，避免组件独立可用但组合后冲突。"], ["交互与测试", "验证折叠、锚点、按钮状态及脚本加载顺序，使页面接入后仍能正常使用。"]], "guards": ["公共组件不重复注入", "重要交互拥有键盘与移动端回退方式", "组件样式不应覆盖业务页面的结构语义"], "links": ["page-standard", "feature-landing", "event-measure"]}, {"id": "page-standard", "name": "page-standard", "kind": "standard", "area": "j", "group": "技术SEO", "intro": "即使内容已经写好，独立HTML页面仍可能因为标题结构、元信息、规范链接或移动端表现不一致而需要返工。这个Skill把这些基础要求变成生成与验收时都能使用的检查标准。页面最终应具备清晰的语义结构、与可见内容一致的结构化数据，以及能够独立检查的跨端呈现。", "inputs": ["页面主题与必要的元信息", "所需内容区块和交互组件", "SEO类型与目标设备约束"], "outputs": ["语义正确的页面骨架", "搜索与社交分享元信息", "结构化数据及响应式验收清单"], "steps": [["页面骨架", "建立单一主要标题、清晰的语义区块和一致的标题层级，保持页面可读和易于抓取。"], ["搜索信息", "按页面需求设置标题、描述、规范链接及分享卡片的基本属性。"], ["结构化表达", "仅在内容确实存在时使用相应的FAQ或步骤类型结构化数据，不为获取展示效果编造内容。"], ["跨端验收", "检查小屏阅读、图片语义、资源加载及交互可达性，确保生成物可独立打开。"]], "guards": ["避免多H1、标题越级和无效规范链接", "结构化数据必须与可见内容一致", "不在演示中保留生产跟踪标识"], "links": ["layout-kit", "feature-landing", "event-measure"]}, {"id": "access-gateway", "name": "access-gateway", "kind": "auth", "area": "k", "group": "基础设施", "intro": "内容管理、批量生产和翻译都会访问需要授权的业务工具，因此每个Skill都重复处理登录会让整套流程变得脆弱。这里将会话检查、用户授权和连接验证集中到一个前置能力里，其他Skill只在确认可用后继续调用。它解决的是协作和安全边界的问题，不把任何真实凭证或连接信息带到展示页面。", "inputs": ["用户主动授权的会话", "本地可用的授权状态", "目标工具连接需求"], "outputs": ["经验证的访问上下文", "需要重新授权的明确提示", "不向页面暴露的安全会话"], "steps": [["会话检查", "在调用管理工具前确认现有授权是否有效、是否接近过期，避免无意义的失败请求。"], ["人工授权", "仅在缺失或失效时发起用户可感知的授权动作，不绕过登录确认。"], ["连接验证", "完成授权后检查当前身份和工具可达性，再交由下游Skill继续业务操作。"], ["最小暴露", "对日志与展示内容进行过滤；前端作品集只描述流程，不包含令牌、主机或接口信息。"]], "guards": ["不保存真实凭证、授权地址或密钥到演示文件", "不展示服务标识和后台连接配置", "无有效授权时停止写入类操作"], "links": ["content-manager", "batch-compose", "multilingual-flow"]}];
const byId=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
function rr(x,y,w,h,r=8,klass='line'){return `<rect class="${klass}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`}
function ln(x1,y1,x2,y2,klass='line'){return `<path class="${klass}" d="M${x1} ${y1} L${x2} ${y2}"/>`}
function path(d,klass='line'){return `<path class="${klass}" d="${d}"/>`}

<script>
(()=>{
  const stage=document.getElementById('architecture');
  const shell=document.getElementById('architectureShell');
  const gallery=document.getElementById('skills');
  const flow=document.getElementById('archFlow');
  const svg=document.getElementById('archWires');
  const units=[...flow.querySelectorAll('.arch-unit')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const NS='http://www.w3.org/2000/svg';
  const links=[];
  let visible=true,phase=0,phaseStart=performance.now(),lastFrame=0,scrollQueued=false;
  const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
  // Straight connectors only: a horizontal path for wide layouts and two 90-degree segments on mobile.
  function rebuildWires(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);links.length=0;
    const fr=flow.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${fr.width} ${fr.height}`);
    for(let i=0;i<units.length-1;i++){
      const a=units[i].getBoundingClientRect(),b=units[i+1].getBoundingClientRect();
      const row=Math.abs(a.top-b.top)<40;
      let d;
      if(row){const sx=a.right-fr.left, sy=(a.top+a.bottom)/2-fr.top, ex=b.left-fr.left,ey=(b.top+b.bottom)/2-fr.top;
        d=`M ${sx} ${sy} H ${ex}`;
      }else{
        const sx=(a.left+a.right)/2-fr.left,sy=a.bottom-fr.top,ex=(b.left+b.right)/2-fr.left,ey=b.top-fr.top;
        const mid=sy+(ey-sy)/2;
        d=`M ${sx} ${sy} V ${mid} H ${ex} V ${ey}`;
      }
      const line=document.createElementNS(NS,'path');line.setAttribute('d',d);line.setAttribute('class','route-line');svg.appendChild(line);
      const dot=document.createElementNS(NS,'circle');dot.setAttribute('r','4');dot.setAttribute('class','route-cursor');svg.appendChild(dot);
      links.push({line,dot,len:line.getTotalLength()});
    }
  }
  function paintProgress(){
    const s=stage.getBoundingClientRect(),g=gallery.getBoundingClientRect();
    // The hero makes room for the entering skill matrix in normal document flow.
    const hand=clamp((-s.top)/(s.height*.72));
    const enter=clamp((innerHeight-g.top)/(innerHeight*.75));
    if(!reduce.matches){
      shell.style.transform=`translate3d(0,${(-hand*16).toFixed(2)}px,0) scale(${(1-hand*.045).toFixed(4)})`;
      shell.style.opacity=String(1-hand*.24);
      gallery.style.transform=`translate3d(0,${((1-enter)*20).toFixed(2)}px,0) scale(${(.990+enter*.010).toFixed(4)})`;
      gallery.style.opacity=String(.80+enter*.20);
    }else{shell.style.transform='';shell.style.opacity='';gallery.style.transform='';gallery.style.opacity=''}
  }
  function onScroll(){if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{scrollQueued=false;paintProgress()})}
  function frame(time){
    if(visible&&!reduce.matches&&document.visibilityState==='visible'&&time-lastFrame>32){
      lastFrame=time;
      const elapsed=(time-phaseStart)%(4*3300);const i=Math.floor(elapsed/3300),p=(elapsed%3300)/3300;
      if(phase!==i){phase=i;units.forEach((u,j)=>u.classList.toggle('is-focused',j===i))}
      for(let j=0;j<links.length;j++){
        const {line,dot,len}=links[j];

        const pt=line.getPointAtLength(len*local);

  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  units.forEach((u,j)=>u.classList.toggle('is-focused',j===0));
  rebuildWires();paintProgress();requestAnimationFrame(frame);
})();
